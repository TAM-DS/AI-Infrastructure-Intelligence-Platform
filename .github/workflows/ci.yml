name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Verify headline metrics
        run: PYTHONPATH=src python -m finops_intelligence.metrics --data-dir data --verify

      - name: Check whitespace
        run: git diff --check
